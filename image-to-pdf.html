<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image to PDF Converter - ToolMela</title>
    <!-- jsPDF Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); width: 100%; max-width: 480px; text-align: center; }
        h1 { font-size: 24px; color: #1e293b; margin-bottom: 8px; }
        p { color: #64748b; font-size: 14px; margin-bottom: 24px; }
        .upload-area { border: 2px dashed #cbd5e1; border-radius: 12px; padding: 25px; cursor: pointer; transition: 0.3s; background: #f1f5f9; }
        .upload-area:hover { border-color: #2563eb; background: #eff6ff; }
        input[type="file"] { display: none; }
        .btn { background-color: #2563eb; color: white; border: none; padding: 14px 20px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 20px; transition: 0.2s; }
        .btn:hover { background-color: #1d4ed8; }
        #preview { max-width: 100%; max-height: 250px; margin-top: 15px; border-radius: 8px; display: none; margin-left: auto; margin-right: auto; }
        .back-link { display: inline-block; margin-top: 20px; color: #64748b; text-decoration: none; font-size: 14px; }
        .back-link:hover { color: #2563eb; }
    </style>
</head>
<body>

<div class="card">
    <h1>🖼️ Image to PDF Converter</h1>
    <p>کسی بھی تصویر کو پی ڈی ایف میں تبدیل کریں اور ڈاؤن لوڈ یا شیئر کریں</p>

    <label for="imageInput" class="upload-area">
        <div style="font-size: 40px; margin-bottom: 8px;">📁</div>
        <span style="color: #334155; font-weight: 500;">تصویر منتخب کرنے کے لیے یہاں کلک کریں</span>
    </label>
    <input type="file" id="imageInput" accept="image/*">

    <img id="preview" alt="Preview">

    <button class="btn" onclick="generatePDF()">PDF فائل بنائیں اور ڈاؤن لوڈ کریں</button>
    
    <br>
    <a href="index.html" class="back-link">← ہوم پیج پر واپس جائیں</a>
</div>

<script>
    let imgData = null;

    document.getElementById('imageInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                imgData = event.target.result;
                const img = document.getElementById('preview');
                img.src = imgData;
                img.style.display = 'block';
            }
            reader.readAsDataURL(file);
        }
    });

    function generatePDF() {
        if (!imgData) {
            alert('براہ کرم پہلے کوئی تصویر اپلوڈ کریں!');
            return;
        }
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF();
        
        // تصویر کو پی ڈی ایف پیج کے سائز کے مطابق ایڈجسٹ کرنا
        pdf.addImage(imgData, 'JPEG', 15, 15, 180, 160);
        
        // PDF ڈاؤن لوڈ کریں
        pdf.save('ToolMela-Document.pdf');
    }
</script>

</body>
</html>
