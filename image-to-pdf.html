<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image to PDF - ToolMela</title>
    <!-- jsPDF Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #f8fafc; margin: 0; padding: 0; }
        .container { max-width: 500px; margin: 30px auto; text-align: center; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { color: #1e293b; margin-bottom: 10px; }
        p { color: #64748b; font-size: 14px; }
        input[type="file"] { margin: 20px 0; }
        .btn { background-color: #2563eb; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; margin-top: 10px; }
        .btn:hover { background-color: #1d4ed8; }
        #preview { max-width: 100%; height: auto; margin-top: 15px; display: none; border-radius: 8px; border: 1px solid #e2e8f0; }
    </style>
</head>
<body>

<div class="container">
    <h2>Image to PDF Converter</h2>
    <p>تصویر منتخب کریں اور پی ڈی ایف ڈاؤن لوڈ کریں</p>
    
    <input type="file" id="imageInput" accept="image/*">
    <br>
    <img id="preview" alt="Preview">
    <br>
    <button class="btn" onclick="generatePDF()">PDF ڈاؤن لوڈ کریں</button>
</div>

<script>
    let imgData = null;

    document.getElementById('imageInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                imgData = event.target.result;
                const img = document.getElementById('preview');
                img.src = imgData;
                img.style.display = 'block';
            }
            reader.readAsDataURL(file);
        }
    });

    function generatePDF() {
        if (!imgData) {
            alert('براہ کرم پہلے تصویر اپلوڈ کریں!');
            return;
        }
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF();
        
        // PDF میں تصویر کی چوڑائی اور لمبائی سیٹ کرنا
        pdf.addImage(imgData, 'JPEG', 15, 15, 180, 160);
        
        // PDF ڈاؤن لوڈ کرنا
        pdf.save('ToolMela-Image.pdf');
    }
</script>

</body>
</html>
