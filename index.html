/* =========================
   INSTALL APP
========================= */

let deferredPrompt = null;

const installBtn =
document.getElementById("installBtn");


window.addEventListener(
"beforeinstallprompt",
function(e){

e.preventDefault();

deferredPrompt = e;

installBtn.style.display = "block";

}
);


installBtn.addEventListener(
"click",
async function(){

if(deferredPrompt){

deferredPrompt.prompt();

const result =
await deferredPrompt.userChoice;

if(result.outcome === "accepted"){

installBtn.style.display = "none";

}

deferredPrompt = null;

}else{

alert(
"Install option is not ready yet.\n\n" +
"Chrome menu ⋮ → Add to Home screen → Install"
);

}

}
);


window.addEventListener(
"appinstalled",
function(){

installBtn.style.display = "none";

deferredPrompt = null;

}
);


/* =========================
   SERVICE WORKER
========================= */

if("serviceWorker" in navigator){

window.addEventListener(
"load",
function(){

navigator.serviceWorker
.register("./sw.js")
.then(function(){

console.log("ToolMela Service Worker registered.");

})
.catch(function(error){

console.log(
"Service Worker error:",
error
);

});

});

const categories=[

...new Set(tools.map(x=>x[2]))
];

let active="All";

const grid=
document.getElementById("grid");

const cats=
document.getElementById("cats");

const search=
document.getElementById("search");

const count=
document.getElementById("count");


categories.forEach(c=>{

let b=document.createElement("button");

b.className=
"cat"+(c==="All"?" active":"");

b.textContent=c;

b.onclick=()=>{

active=c;

document
.querySelectorAll(".cat")
.forEach(x=>
x.classList.remove("active")
);

b.classList.add("active");

render();

};

cats.appendChild(b);

});


function render(){

let q=
(search.value||"").toLowerCase();

let a=
tools.filter(t=>
(active==="All"||t[2]===active)
&&
(
t[1].toLowerCase().includes(q)
||
t[3].toLowerCase().includes(q)
)
);

count.textContent=
`Showing ${a.length} of ${tools.length} tools`;

grid.innerHTML=
a.map(t=>`

<div class="tool"
onclick="openTool('${t[4]}')">

<div class="icon">
${t[0]}
</div>

<h3>
${t[1]}
</h3>

<p>
${t[3]}
</p>

<span class="tag">
${t[2]}
</span>

</div>

`).join("");

}


search.oninput=render;

render();

function runText(id){

let s=
document.getElementById("a")?.value||"";

let v="";


if(id==="wordcount")

v=
`Words: ${
s.trim()
?
s.trim().split(/\s+/).length
:
0
}
Characters: ${s.length}
Characters (no spaces): ${
s.replace(/\s/g,"").length
}
Lines: ${
s
?
s.split(/\n/).length
:
0
}`;


if(id==="case")

v=
`UPPER: ${s.toUpperCase()}
LOWER: ${s.toLowerCase()}
TITLE: ${s.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase())}
SENTENCE: ${s.toLowerCase().replace(/(^\s*\w|[.!?]\s*\w)/g,m=>m.toUpperCase())}`;


if(id==="spaces")
v=
s
.replace(/[ \t]+/g," ")
.replace(/\n\s*\n+/g,"\n\n")
.trim();


if(id==="reverse")
v=[...s].reverse().join("");


if(id==="binary")
v=
[...s]
.map(c=>
c.charCodeAt(0)
.toString(2)
.padStart(8,"0")
)
.join(" ");


if(id==="urlencode")
v=encodeURIComponent(s);


if(id==="urldecode")
try{
v=decodeURIComponent(s)
}
catch(e){
v="Invalid encoded URL"
}


if(id==="linkclean")
try{

let u=new URL(s);

[
"utm_source",
"utm_medium",
"utm_campaign",
"utm_term",
"utm_content",
"fbclid",
"gclid"
]
.forEach(k=>
u.searchParams.delete(k)
);

v=u.toString();

}
catch(e){

v="Enter a valid URL";

}


if(id==="sort")

v=
s
.split(/[,\s]+/)
.filter(Boolean)
.map(Number)
.filter(Number.isFinite)
.sort((a,b)=>a-b)
.join("\n");


if(id==="dupes")

v=
[...new Set(
s.split(/\r?\n/)
)]
.join("\n");


if(id==="replace")

v=
s.split(
document.getElementById("find").value
)
.join(
document.getElementById("rep").value
);


if(id==="lines")

v=
`Lines: ${
s
?
s.split(/\r?\n/).length
:
0
}`;


if(id==="freq"){

let m={};

[...s.toLowerCase()]
.forEach(c=>{

if(c.trim())
m[c]=(m[c]||0)+1;

});

v=
Object.entries(m)
.sort((a,b)=>b[1]-a[1])
.map(x=>`${x[0]}: ${x[1]}`)
.join("\n");

}


if(id==="emails")

v=
(
s.match(
/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/ig
)
||
[]
)
.join("\n");


if(id==="urls")

v=
(
s.match(
/https?:\/\/[^\s]+/ig
)
||
[]
)
.join("\n");


if(id==="extract")

v=
`Emails:
${
s.match(
/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/ig
)
||
"None"
}

URLs:
${
s.match(
/https?:\/\/[^\s]+/ig
)
||
"None"
}`;


if(id==="htmlescape")

v=
s
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;");


if(id==="json")

try{

v=
JSON.stringify(
JSON.parse(s),
null,
2
);

}
catch(e){

v="Invalid JSON: "+e.message;

}


if(id==="cssmin")

v=
s
.replace(/\/\*[\s\S]*?\*\//g,"")
.replace(/\s+/g," ")
.replace(/\s*([{}:;,])\s*/g,"$1")
.trim();


if(id==="jsmin")

v=
s
.replace(/\/\/.*$/gm,"")
.replace(/\/\*[\s\S]*?\*\//g,"")
.replace(/\s+/g," ")
.trim();


if(id==="compare"){

let b=
prompt("Enter second text")||"";

v=
s===b
?
"Texts are identical."
:
`Texts are different.
First length: ${s.length}
Second length: ${b.length}`;

}


if(id==="limit"){

let n=
+document.getElementById("lim").value||100;

v=
s.length<=n
?
`OK — ${s.length}/${n}`
:
`Over limit by ${
s.length-n
} characters (${s.length}/${n})`;

}


if(id==="textfile"){

downloadBlob(
new Blob(
[s],
{type:"text/plain"}
),
"toolmela-text.txt"
);

v="TXT file downloaded.";

}


out(v);

}

function genPassword(){

let n=
Math.max(
4,
Math.min(
100,
+document.getElementById("plen").value||16
)
);

let type=
document.getElementById("pchars").value;

let chars=
type==="lettersOnly"
?
"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz"
:
type==="letters"
?
"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789"
:
"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+-=[]{}";

let a=
new Uint32Array(n);

crypto.getRandomValues(a);

out(
[...a]
.map(x=>chars[x%chars.length])
.join("")
);

}


function uuid(){

out(
crypto.randomUUID
?
crypto.randomUUID()
:
"xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx"
.replace(/[xy]/g,c=>{

let r=Math.random()*16|0;

let v=
c==="x"
?
r
:
(r&3|8);

return v.toString(16);

})
);

}
